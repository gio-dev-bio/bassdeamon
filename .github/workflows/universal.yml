name: BassDeamon macOS Universal
on:
  push:
    branches: ['build/bassdeamon-1.0.8-universal', 'fix/gui-regression']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build
          key: macos-universal-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: macos-universal-${{ hashFiles('CMakeLists.txt') }}-
      - name: Configure Universal VST3
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - run: cmake --build build --config Release --parallel 3
      - run: ctest --test-dir build -C Release --parallel 2 --output-on-failure
      - name: Verify architectures and sign
        run: |
          bundle=build/BassDeamon_artefacts/Release/VST3/BassDeamon.vst3
          lipo -archs "$bundle/Contents/MacOS/BassDeamon"
          lipo "$bundle/Contents/MacOS/BassDeamon" -verify_arch x86_64 arm64
          codesign --force --sign - --timestamp=none "$bundle"
          codesign --verify --strict --verbose=2 "$bundle"
      - name: Capture the actual editor
        run: build/plugin_tests_artefacts/Release/plugin_tests --capture "$PWD/GUI-Preview.png"
      - name: Require visual evidence and source identity
        run: |
          for image in GUI-Preview.png GUI-Raw.png GUI-Raw-Advanced.png GUI-Duck-Raw.png; do
            test -s "$image"
          done
          git rev-parse HEAD > BUILD-COMMIT.txt
          shasum -a 256 GUI-Preview.png GUI-Raw.png GUI-Raw-Advanced.png GUI-Duck-Raw.png build/BassDeamon_artefacts/Release/VST3/BassDeamon.vst3/Contents/MacOS/BassDeamon > BUILD-SHA256.txt
      - name: Package Universal plugin
        run: |
          package="$PWD/BassDeamon-1.0.8-macOS-Universal.zip"
          (cd build/BassDeamon_artefacts/Release/VST3 && zip -Xqr "$package" BassDeamon.vst3)
          bash -n install.sh
          zip -Xj "$package" INSTALL.txt install.sh BUILD-COMMIT.txt BUILD-SHA256.txt GUI-Preview.png GUI-Raw.png GUI-Raw-Advanced.png GUI-Duck-Raw.png
          unzip -t "$package"
          unzip -q "$package" -d package-verification
          bundle=package-verification/BassDeamon.vst3
          lipo "$bundle/Contents/MacOS/BassDeamon" -verify_arch x86_64 arm64
          codesign --verify --strict --verbose=2 "$bundle"
      - name: Test installation and replacement from the extracted ZIP
        run: |
          test_home="$(mktemp -d)"
          env HOME="$test_home" bash package-verification/install.sh
          env HOME="$test_home" bash package-verification/install.sh
          installed="$test_home/Library/Audio/Plug-Ins/VST3/BassDeamon.vst3"
          test -x "$installed/Contents/MacOS/BassDeamon"
          codesign --verify --strict "$installed"
      - uses: actions/upload-artifact@v4
        with:
          name: BassDeamon-1.0.8-macOS-Universal
          path: |
            BassDeamon-1.0.8-macOS-Universal.zip
            GUI-Preview.png
            GUI-Raw.png
            GUI-Raw-Advanced.png
            GUI-Duck-Raw.png
            GUI-Phase-AB.png
            GUI-ScopeComparePre.png
          if-no-files-found: error
