name: BassDeamon macOS Universal
on:
  push:
    branches: ['build/bassdeamon-1.0.12-universal', 'fix/gui-regression']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    if: "!contains(github.event.head_commit.message, '[gui-review]')"
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_gui_lock.py
      - uses: actions/cache/restore@v4
        with:
          path: build
          key: macos-universal-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            macos-universal-${{ hashFiles('CMakeLists.txt') }}-
            macos-universal-
      - name: Configure Universal VST3
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - run: cmake --build build --config Release --parallel 3
      - uses: actions/cache/save@v4
        with:
          path: build
          key: macos-universal-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
      - run: ctest --test-dir build -C Release --parallel 2 --output-on-failure
        env:
          BASSDEAMON_AUTO_MIX_PREVIEW: ${{ github.workspace }}/GUI-AutoMix.png
      - name: Verify architectures and sign
        run: |
          bundle=build/BassDeamon_artefacts/Release/VST3/BassDeamon.vst3
          lipo -archs "$bundle/Contents/MacOS/BassDeamon"
          lipo "$bundle/Contents/MacOS/BassDeamon" -verify_arch x86_64 arm64
          codesign --force --sign - --timestamp=none "$bundle"
          codesign --verify --strict --verbose=2 "$bundle"
      - name: Capture the actual editor
        run: build/plugin_tests_artefacts/Release/plugin_tests --capture "$PWD/GUI-Preview.png"
      - name: Require visual evidence and source identity
        run: |
          for image in GUI-Preview.png GUI-Raw.png GUI-Raw-Advanced.png GUI-Duck-Raw.png; do
            test -s "$image"
          done
          git rev-parse HEAD > BUILD-COMMIT.txt
          shasum -a 256 GUI-Preview.png GUI-Raw.png GUI-Raw-Advanced.png GUI-Duck-Raw.png build/BassDeamon_artefacts/Release/VST3/BassDeamon.vst3/Contents/MacOS/BassDeamon > BUILD-SHA256.txt
      - name: Package Universal plugin
        run: |
          package="$PWD/BassDeamon-1.0.12-macOS-Universal.zip"
          (cd build/BassDeamon_artefacts/Release/VST3 && zip -Xqr "$package" BassDeamon.vst3)
          bash -n Installa_Aggiorna.command
          chmod +x Installa_Aggiorna.command
          zip -Xj "$package" INSTALL.txt Installa_Aggiorna.command docs/RELEASE_1.0.12_IT.md BUILD-COMMIT.txt BUILD-SHA256.txt GUI-Preview.png GUI-Raw.png GUI-Raw-Advanced.png GUI-Duck-Raw.png GUI-AutoMix.png
          unzip -t "$package"
          unzip -q "$package" -d package-verification
          bundle=package-verification/BassDeamon.vst3
          lipo "$bundle/Contents/MacOS/BassDeamon" -verify_arch x86_64 arm64
          codesign --verify --strict --verbose=2 "$bundle"
      - name: Test installation and replacement from the extracted ZIP
        run: |
          source=package-verification/BassDeamon.vst3
          installed=/Library/Audio/Plug-Ins/VST3/BassDeamon.vst3
          test ! -e "$installed" && test ! -L "$installed"
          test -x package-verification/Installa_Aggiorna.command
          test ! -e package-verification/install.sh
          trap 'sudo /bin/rm -rf -- "$installed"' EXIT
          xattr -w com.apple.quarantine '0081;00000000;InstallerTest;' "$source/Contents/MacOS/BassDeamon"
          package-verification/Installa_Aggiorna.command </dev/null
          test -x "$installed/Contents/MacOS/BassDeamon"
          attributes="$(sudo xattr -r "$installed")"
          [[ "$attributes" != *com.apple.quarantine* ]]
          codesign --verify --strict "$installed"
          sudo touch "$installed/Contents/old-version-test"
          xattr -r -d com.apple.quarantine "$source"
          package-verification/Installa_Aggiorna.command </dev/null
          test ! -e "$installed/Contents/old-version-test"
          cmp "$source/Contents/MacOS/BassDeamon" "$installed/Contents/MacOS/BassDeamon"
          codesign --verify --strict "$installed"
      - uses: actions/upload-artifact@v4
        with:
          name: BassDeamon-1.0.12-macOS-Universal
          path: |
            BassDeamon-1.0.12-macOS-Universal.zip
            GUI-AutoMix.png
            GUI-Preview.png
            GUI-Raw.png
            GUI-Raw-Advanced.png
            GUI-Duck-Raw.png
            GUI-Phase-AB.png
            GUI-ScopeComparePre.png
          if-no-files-found: error
